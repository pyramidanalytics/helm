apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pyramidAnalytics.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: pagis
  replicas: {{ if .Values.gis.enabled }}1{{ else }}0{{ end }}
  template:
    metadata:
      labels:
        app: pagis
        {{- include "pyramidAnalytics.selectorLabels" . | nindent 8 }}
    spec:
{{- with (include "pyramidAnalytics.nodeSelector" (dict "root" $ "local" .Values.gis.nodeSelector "skip" .Values.gis.disableGlobalNodeSelector)) }}
{{ . | indent 6 }}
{{- end }}
      serviceAccountName: pa-service
      containers:
        - name: pagis
          image: "{{ .Values.repo }}/gis:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          readinessProbe:
            exec:
              command:
                - ./readiness.sh
          resources:
            limits:
              cpu: "{{ .Values.gis.limits.cpu }}"
              memory: "{{ .Values.gis.limits.memory }}"
            requests:
              cpu: "{{ .Values.gis.requests.cpu }}"
              memory: "{{ .Values.gis.requests.memory }}"
          env:
{{- include "pyramidAnalytics.baseEnv" . | nindent 12 }}
{{- include "pyramidAnalytics.containerSecurityContext" . | nindent 10 }}
{{- include "pyramidAnalytics.dbMtls.mount" . | nindent 6 }}
{{- include "pyramidAnalytics.dbMtls.volume" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
